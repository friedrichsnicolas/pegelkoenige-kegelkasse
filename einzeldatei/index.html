<style>
/* Layout: Kopfzeile mit Tabs, darunter je Tab ein Arbeitsbereich; Abend-Tab = Spielerleiste links + Strafen-Kacheln rechts (Tablet quer) */
:root{
  --bg:#edece8; --surface:#ffffff; --surface2:#f6f5f2; --ink:#171512; --muted:#615b52; --line:#dcd8d0;
  --accent:#8a5300; --accent-ink:#ffffff; --accent-soft:#f5e6c8; --hi:#5b3cc4; --hi-soft:#ece7fb;
  --good:#167a3a; --bad:#b42318; --bar2:#b3aca1;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --brand:"Uncial Antiqua",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11100e; --surface:#1b1916; --surface2:#24211d; --ink:#efebe4; --muted:#a59d91; --line:#37322b;
  --accent:#f0b545; --accent-ink:#241600; --accent-soft:#3d2c10; --hi:#b9a2ff; --hi-soft:#2a2240;
  --good:#5cd18a; --bad:#ff7b6e; --bar2:#6b645a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#11100e; --surface:#1b1916; --surface2:#24211d; --ink:#efebe4; --muted:#a59d91; --line:#37322b;
  --accent:#f0b545; --accent-ink:#241600; --accent-soft:#3d2c10; --hi:#b9a2ff; --hi-soft:#2a2240;
  --good:#5cd18a; --bad:#ff7b6e; --bar2:#6b645a; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:8px 16px;height:64px}
.brand{font-family:var(--display);font-size:26px;font-weight:700;display:flex;align-items:center;gap:8px}

.logo{display:inline-grid;place-items:center;border-radius:50%;background:#fff;color:#141210;flex:none;box-shadow:0 0 0 1px var(--line)}
.logo svg{width:100%;height:100%}
.brand .logo{width:46px;height:46px}
.brandname{font-family:var(--brand);font-weight:400;font-size:22px;letter-spacing:.01em;white-space:nowrap}
.hero-logo{width:min(220px,50vw);height:min(220px,50vw);margin:0 auto 12px}
@media (max-width:700px){.brandname{display:none}}
.hamb{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;padding:0}
.hamb svg{width:24px;height:24px}
.ptitle{font-family:var(--display);font-size:24px;font-weight:600;color:var(--muted)}
.ptitle::before{content:"/";margin-right:10px;color:var(--line)}
#drawer[hidden]{display:none}
.drawer-back{position:fixed;inset:0;background:rgba(5,12,16,.5);z-index:40}
.drawer{position:fixed;z-index:41;top:0;left:0;bottom:0;width:min(320px,86vw);background:var(--surface);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:4px;overflow:auto;animation:slidein .16s ease-out}
@keyframes slidein{from{transform:translateX(-100%)}to{transform:none}}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.drawer h4{margin:14px 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.drawer a,.drawer button.dl{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);font-weight:600;font-size:17px;padding:12px 12px;border-radius:10px;border:0;background:none;text-align:left;width:100%;min-height:48px}
.drawer a:hover,.drawer button.dl:hover{background:var(--surface2)}
.drawer a[aria-current="page"]{background:var(--accent-soft)}
.drawer .ico{width:22px;text-align:center;color:var(--accent);font-family:var(--display);font-size:18px}
.drawer .evinfo{font-size:14px;color:var(--muted);padding:0 12px}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--good)}
.dot.busy{background:var(--hi)} .dot.off{background:var(--bad)}
main{padding:16px;max-width:1400px;margin:0 auto;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn:hover{border-color:var(--muted)}
a.btn{color:var(--ink)}
.btn.primary,a.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.small{min-height:34px;padding:5px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.pill.open{background:var(--accent-soft);border-color:transparent}
.pill.closed{color:var(--muted)}
.pill.cancel{color:var(--bad)}
.muted{color:var(--muted)}
.small{font-size:14px}
select.inp,input.inp{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-height:44px}
input.inp.narrow{width:110px}
label.fld{display:grid;gap:4px;font-size:14px;color:var(--muted);font-weight:600}
.evbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.evbar h2{font-size:30px}
.mult{display:flex;align-items:center;gap:10px;background:var(--hi-soft);border:1px solid color-mix(in srgb,var(--hi) 40%,transparent);border-radius:12px;padding:8px 12px}
.mult b{font-family:var(--display);font-size:22px;color:var(--hi)}
.entry{display:grid;grid-template-columns:minmax(230px,300px) 1fr;gap:16px;align-items:start}
.players{display:grid;gap:6px;position:sticky;top:76px}
.players h3{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:6px 0 2px}
.pbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;min-height:56px;font-weight:600;font-size:18px}
.pbtn .amt{font-family:var(--display);font-size:20px}
.pbtn.sel{border-color:var(--accent);background:var(--accent-soft)}
.pbtn.abs{min-height:44px;font-size:16px;font-weight:500;color:var(--muted);background:var(--surface2)}
.pbtn.abs.sel{color:var(--ink)}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 5px;margin-left:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tile{position:relative;display:flex}
.tile-main{flex:1;display:grid;grid-template-rows:auto auto 1fr;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px 10px;min-height:118px;transition:transform .06s}
.tile-main:active{transform:scale(.97)}
.tile-main:disabled{opacity:.4;cursor:not-allowed;transform:none}
.t-name{font-weight:600;font-size:16px;line-height:1.2;padding-right:30px}
.t-price{font-size:14px;color:var(--muted)}
.t-count{font-family:var(--display);font-size:40px;font-weight:700;align-self:end;line-height:1}
.t-count.zero{color:var(--line)}
.tile.ismult .tile-main{border:2px solid var(--hi);background:var(--hi-soft)}
.tile.ismult .t-price b{color:var(--hi)}
.tile.win .tile-main{border-style:dashed}
.tile-minus{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:22px;line-height:1;font-weight:700}
.tile-minus:disabled{opacity:.3}
.banner{border-radius:12px;padding:12px 14px;background:var(--surface2);border:1px solid var(--line)}
.banner.warn{background:var(--hi-soft);border-color:transparent}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
tr.absent td{color:var(--muted)}
.mtx th.pen{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;height:200px;vertical-align:bottom;padding:6px 4px;font-size:12px}
.mtx th.pen.ismult{color:var(--hi)}
.mtx td.cnt{text-align:center;font-variant-numeric:tabular-nums;padding:6px 4px}
.mtx td.cnt.z{color:var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.1}
.kpi.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.kpi.main .l{color:inherit;opacity:.8}
.pos{color:var(--bad);font-weight:600} .neg{color:var(--good);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chartbox{position:relative;height:300px}
.cell{width:100%;min-width:52px;min-height:40px;border-radius:8px;border:1px dashed var(--line);background:transparent;font-weight:600;font-variant-numeric:tabular-nums}
.cell.paid{background:var(--accent-soft);border:1px solid transparent}
.cell.cancel{opacity:.7}
.records{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.rec{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface2)}
.rec .l{font-size:13px;color:var(--muted);font-weight:600}
.rec .n{font-family:var(--display);font-size:24px;font-weight:700}
#dlg[hidden]{display:none}
.dlg-back{position:fixed;inset:0;background:rgba(5,12,16,.55);z-index:50}
.dlg{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border-radius:16px;padding:20px;display:grid;gap:14px;border:1px solid var(--line)}
.dlg h2{font-size:26px}
.att{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.att button{border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--surface2);font-weight:600;text-align:left;min-height:52px}
.att button.on{border-color:var(--accent);background:var(--accent-soft)}
.att button .s{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.sum-line{display:flex;justify-content:space-between;padding:4px 0}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-weight:600}
.empty{text-align:center;padding:40px 16px}
.legend{display:flex;gap:16px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* Eingabe (Querformat) */
.ein{display:flex;flex-direction:column;gap:12px}
.ein-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ein-bar .evdate{font-family:var(--display);font-size:26px;font-weight:700}
.step{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.step i{font-style:normal;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:14px}
.step.dim i{background:var(--line);color:var(--muted)}
.pstrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.pchip{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left;min-height:68px;display:grid;align-content:center;gap:2px}
.pchip .n{font-weight:700;font-size:20px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip .a{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.pchip.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.pchip.sel .a{color:inherit;opacity:.85}
.absstrip{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px}
.achip{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:6px 12px;color:var(--muted);font-weight:600;min-height:38px}
.achip.sel{border-style:solid;border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.selline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:44px;padding:6px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.selline .who{font-family:var(--display);font-size:24px;font-weight:700}
.selline .last{color:var(--muted);font-size:15px}
.ptiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ptiles .tile-main{min-height:92px;padding:10px 12px 8px}
.ptiles .t-count{font-size:34px}
.ptiles.nosel .tile-main{opacity:.45}
.tile.flash .tile-main{animation:flash .5s ease-out}
@keyframes flash{0%{background:var(--accent);color:var(--accent-ink)}100%{}}
.ov-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ov-kpis .kpi .v{font-size:28px}
@media (orientation:landscape) and (min-width:960px) and (min-height:600px){
  main.fit{height:calc(100dvh - 64px);overflow:hidden;padding-bottom:12px}
  main.fit .ein{height:100%}
  main.fit .ptiles{flex:1;grid-auto-rows:1fr;min-height:0}
  main.fit .ptiles .tile-main{min-height:0}
}
@media (max-width:960px){.ptiles{grid-template-columns:repeat(3,1fr)}}
@media (max-width:820px){.entry{grid-template-columns:1fr}.players{position:static;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.players h3{grid-column:1/-1}.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.tile-main{transition:none}.tile.flash .tile-main,.drawer{animation:none}}
</style>
</head>

<main id="main"><div class="card empty"><span class="logo hero-logo"><svg viewBox="0 0 640 640" role="img" aria-label="Logo Anrather Pegelkönige"><use href="#lg"/></svg></span>Daten werden geladen …</div></main>
<div id="dlg" hidden></div>
<script>
'use strict';
let db=null, cfg=null, evs={}, pays={}, cash={};
const got={cfg:false,ev:false,pay:false,cash:false};
let confirmed=false, loadErr='', noDb=false;
const overlay={}, pending={}, inflight={}, timers={};
const ui={tab:'eingabe',eid:null,sel:null,undo:[],year:null,showAll:false,last:'',flash:null};
const charts=[];
try{ui.eid=localStorage.getItem('kk-eid')||null}catch(e){}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1=x=>Math.round(((x||0)+1e-9)*10)/10;
const r2=x=>Math.round(((x||0)+(x<0?-1e-9:1e-9))*100)/100;
const eur=n=>r2(n).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const num=n=>r2(n).toLocaleString('de-DE',{maximumFractionDigits:2});
const isObj=o=>o&&typeof o==='object'&&!Array.isArray(o);
function merge(t,s){for(const k in s){if(isObj(s[k])){if(!isObj(t[k]))t[k]={};merge(t[k],s[k])}else t[k]=s[k]}return t}
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const dlong=s=>{if(!s)return'';const [y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1,d);return WD[dt.getDay()]+' '+String(d).padStart(2,'0')+'.'+String(m).padStart(2,'0')+'.'+y};
const dshort=s=>{if(!s)return'';const [y,m,d]=s.split('-');return d+'.'+m+'.'+y.slice(2)};
const parseNum=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const slug=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||('x'+Date.now());
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ---------- Daten-Zugriff ---------- */
function getEv(id){if(!evs[id]&&!overlay[id])return null;const e=merge(clone(evs[id]),clone(overlay[id]||{}));e.id=id;return e}
function evList(){const ids=new Set([...Object.keys(evs),...Object.keys(overlay)]);return [...ids].map(getEv).filter(e=>e&&e.date).sort((a,b)=>a.date.localeCompare(b.date))}
function pens(all){return Object.entries(cfg?.penalties||{}).map(([id,p])=>({id,...p})).filter(p=>all||p.active!==false).sort((a,b)=>(a.order??99)-(b.order??99))}
function members(all){return Object.entries(cfg?.members||{}).map(([id,m])=>({id,...m})).filter(m=>all||m.active!==false).sort((a,b)=>(a.order??99)-(b.order??99))}

function patchEv(eid,p){
  pending[eid]=merge(pending[eid]||{},p);
  overlay[eid]=merge(overlay[eid]||{},p);
  scheduleRender(true);updateSync();
  clearTimeout(timers[eid]);timers[eid]=setTimeout(()=>flush(eid),300);
}
async function flush(eid){
  if(inflight[eid]||!pending[eid])return;
  const p=pending[eid];delete pending[eid];inflight[eid]=true;updateSync();
  try{await db.doc('evenings/'+eid).update(p)}
  catch(e){
    try{await new Promise(r=>setTimeout(r,500+Math.random()*500));await db.doc('evenings/'+eid).update(p)}
    catch(e2){toast('Speichern fehlgeschlagen: '+(e2.code==='invalid_argument'||e2.code==='permission-denied'?'keine Schreibrechte':'bitte erneut versuchen'))}
  }
  inflight[eid]=false;
  if(pending[eid])flush(eid);else{delete overlay[eid];scheduleRender(true)}
  updateSync();
}
async function safe(fn,msg){try{await fn();return true}catch(e){toast((msg||'Fehler')+(e&&(e.code==='invalid_argument'||e.code==='permission-denied')?': keine Schreibrechte':''));return false}}

/* ---------- Rechnen ---------- */
function rateFor(pen,date){const P=cfg?.penalties?.[pen];if(!P)return 0;let v=P.price??0,best='';
  for(const [d,r] of Object.entries(P.rates||{}))if(r!=null&&d<=(date||'9999')&&d>=best){best=d;v=r}return v}
function pensFor(ev){const used=new Set(Object.values(ev.counts||{}).flatMap(c=>Object.keys(c)));
  return pens(true).filter(p=>used.has(p.id)||(p.active!==false&&(!p.from||p.from<=ev.date)))}
function evalEv(ev){
  const P=cfg?.penalties||{};
  const price=pen=>{const b=ev.prices?.[pen]??rateFor(pen,ev.date);return b*(ev.multPen===pen?(ev.factor||4):1)};
  const people=Object.entries(ev.people||{}).filter(([,p])=>p&&!p.removed).map(([pid,p])=>({pid,...p}))
    .sort((a,b)=>((a.guest?1:0)-(b.guest?1:0))||((a.order??99)-(b.order??99))||String(a.name).localeCompare(b.name));
  const rows=people.map(p=>{const c=ev.counts?.[p.pid]||{};let raw=0,noavg=0;
    for(const k in c){const v=(c[k]||0)*price(k);raw+=v;if(P[k]?.noAvg)noavg+=v}
    return {...p,c,raw,noavg,wins:ev.wins?.[p.pid]||0}});
  const pres=rows.filter(r=>r.present);
  const avg=pres.length?r1(pres.reduce((s,r)=>s+r.raw-r.noavg,0)/pres.length):0;
  for(const r of rows){if(!r.present)r.raw=avg+r.noavg;r.override=ev.overrides?.[r.pid];
    r.total=ev.status==='cancelled'?0:r2(r.override??r.raw)}
  return {rows,avg,price,sum:r2(rows.reduce((s,r)=>s+r.total,0))};
}
function ledger(){
  const L={};const ent=(pid,name)=>L[pid]??={pid,name:name||pid,charged:0,paid:0,don:0,guest:pid.startsWith('g-')};
  for(const e of evList()){if(e.status==='cancelled')continue;for(const r of evalEv(e).rows){const o=ent(r.pid,r.name);o.charged+=r.total;o.name=r.name}}
  for(const p of Object.values(pays)){const o=ent(p.pid,p.name);o.paid+=p.amount||0;o.don+=p.donation||0}
  for(const m of members(true)){ent(m.id,m.name).name=m.name;L[m.id].inactive=m.active===false}
  for(const o of Object.values(L))o.open=r2(o.charged-o.paid);
  return L;
}
function cashFlow(){
  const E=[];
  for(const e of evList()){const s=Object.values(e.contrib||{}).reduce((a,b)=>a+(b||0),0);if(s)E.push({date:e.date,text:'Beiträge Abend '+dshort(e.date),inn:s,kind:'contrib'})}
  for(const [id,p] of Object.entries(pays)){const t=(p.amount||0)+(p.donation||0);if(t)E.push({id,date:p.date,text:'Strafe '+p.name+(p.donation?` (davon ${eur(p.donation)} Spende)`:''),inn:t,kind:'pay'})}
  for(const [id,c] of Object.entries(cash)){E.push({id,date:c.date,text:c.reason||(c.type==='in'?'Einnahme':'Ausgabe'),inn:c.type==='in'?c.amount:0,out:c.type==='in'?0:c.amount,kind:'cash'})}
  E.sort((a,b)=>a.date.localeCompare(b.date)||(a.kind==='cash'?1:-1));
  let bal=cfg?.startBalance||0;for(const x of E){bal=r2(bal+(x.inn||0)-(x.out||0));x.bal=bal}
  return {entries:E,balance:bal};
}

/* ---------- Rendern ---------- */
let rq=false,deferred=false;
function scheduleRender(force){
  const a=document.activeElement;
  if(!force&&a&&$('#main').contains(a)&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')){deferred=true;return}
  if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;render()});
}

function openItems(){
  const td=today();const amt=cfg.contribAmount||5;const L=ledger();
  const E=evList().filter(e=>e.date<=td);
  const out=[];
  for(const o of Object.values(L)){
    const isMem=!!cfg.members[o.pid];const act=isMem&&cfg.members[o.pid].active!==false;
    let soll=0,paid=0,missing=[];
    if(act){for(const e of E){soll+=amt;const v=e.contrib?.[o.pid]||0;paid+=v;if(!v)missing.push(e)}}
    const oc=r2(Math.max(0,soll-paid));
    const os=r2(o.open);
    if(oc>0.004||os>0.004||os<-0.004)out.push({pid:o.pid,name:o.name,guest:o.guest,strafen:os,beitr:oc,nBeitr:Math.round(oc/amt*100)/100,missing:(n=>n>0?missing.slice(-n):[])(Math.ceil(oc/amt-1e-9)),total:r2(Math.max(0,os)+oc)});
  }
  return out.sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name));
}

  let tot=0;

    const soll=EY.length*amt;const sal=r2(paid-soll);tot+=paid;
    h+=`<td class="r num">${eur(paid)}</td><td class="r num">${eur(soll)}</td><td class="r num ${sal<-0.004?'pos':sal>0.004?'neg':''}">${sal>0?'+':''}${eur(sal)}</td></tr>`;
  }
  h+=`<tr><td><b>Summe</b></td>${EY.map(e=>`<td class="c num">${num(Object.values(e.contrib||{}).reduce((a,b)=>a+(b||0),0))}</td>`).join('')}<td class="r num"><b>${eur(tot)}</b></td><td></td><td></td></tr></tbody></table></div>
  <p class="muted small">Soll = Anzahl Abende × Beitrag. Ein negativer Saldo bedeutet: Beiträge offen. Ausgefallene Abende zählen mit.</p></div>`;

}

function statsData(year){
  const E=evList().filter(e=>e.status!=='cancelled'&&e.date.startsWith(year));
  const A={};const penSum={};const nights=[];
  for(const e of E){const x=evalEv(e);const pres=x.rows.filter(r=>r.present);
    nights.push({date:e.date,sum:x.sum,avg:pres.length?x.sum/x.rows.length:0,n:pres.length});
    for(const r of x.rows){const a=A[r.pid]??={pid:r.pid,name:r.name,guest:!!r.guest,ev:0,pres:0,own:0,abs:0,total:0,c:{},wins:0,max:0,maxDate:''};
      a.name=r.name;a.ev++;a.total+=r.total;a.wins+=r.wins;
      if(r.present){a.pres++;a.own+=r.total;if(r.total>a.max){a.max=r.total;a.maxDate=e.date}}else a.abs+=r.total;
      for(const k in r.c){a.c[k]=(a.c[k]||0)+r.c[k];penSum[k]=(penSum[k]||0)+r.c[k]*x.price(k)}}}
  return {E,A,penSum,nights};
}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act],[data-close]');if(!b)return;

function openImport(){
  dialog(`<h2>Daten importieren</h2><p class="muted" style="margin:0">Datei wählen oder den kopierten Text einfügen. Einträge mit gleicher Kennung werden überschrieben, alles andere bleibt erhalten.</p>

    let data=null;const info=box.querySelector('#impInfo'),go=box.querySelector('#impGo');
    const parse=txt=>{try{const o=JSON.parse(txt);if(!o||!o.config||!o.evenings)throw 0;data=o;
      info.innerHTML=`Gefunden: <b>${Object.keys(o.evenings).length}</b> Abende, <b>${Object.keys(o.payments||{}).length}</b> Zahlungen, <b>${Object.keys(o.cashbook||{}).length}</b> Kassenbuch-Einträge${o.exported?' · Stand '+new Date(o.exported).toLocaleString('de-DE'):''}`;go.disabled=false}
      catch(e){data=null;go.disabled=true;info.textContent='Das sieht nicht nach einer Kegelkasse-Sicherung aus.'}};
    box.querySelector('#impT').oninput=e=>parse(e.target.value);
    box.querySelector('#impF').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>parse(r.result);r.readAsText(f)};
    go.onclick=async()=>{go.disabled=true;const jobs=[['config/main',data.config]];
      for(const [k,v] of Object.entries(data.evenings))jobs.push(['evenings/'+k,v]);
      for(const [k,v] of Object.entries(data.payments||{}))jobs.push(['payments/'+k,v]);
      for(const [k,v] of Object.entries(data.cashbook||{}))jobs.push(['cashbook/'+k,v]);
      let done=0,fail=0;
      for(let i=0;i<jobs.length;i+=10){await Promise.all(jobs.slice(i,i+10).map(([p,v])=>db.doc(p).set(v).then(()=>done++).catch(()=>fail++)));info.textContent=`Importiere … ${done+fail} / ${jobs.length}`}
      closeDlg();toast(fail?`${done} importiert, ${fail} fehlgeschlagen`:`${done} Einträge importiert`)};
  });
}

const FB=!!window.KK_STANDALONE;let fbState=null,fbAuth=null;
const FBV='10.12.2';
function loadScript(src){return new Promise((res,rej)=>{const t=document.createElement('script');t.src=src;t.onload=res;t.onerror=rej;document.head.appendChild(t)})}
function fbAdapter(fs){
  const wd=d=>({id:d.id,exists:d.exists,data:()=>d.data(),metadata:d.metadata});
  const docRef=r=>({id:r.id,path:r.path,onSnapshot:(n,e)=>r.onSnapshot({includeMetadataChanges:true},s=>n(wd(s)),e),get:()=>r.get().then(wd),
    update:d=>r.set(d,{merge:true}),set:d=>r.set(d),delete:()=>r.delete()});
  return {doc:p=>docRef(fs.doc(p)),collection:p=>{const c=fs.collection(p);return {path:p,doc:id=>docRef(id?c.doc(id):c.doc()),add:d=>c.add(d).then(docRef),
    onSnapshot:(n,e)=>c.onSnapshot({includeMetadataChanges:true},s=>n({docs:s.docs.map(wd),size:s.size,empty:s.empty,metadata:s.metadata}),e)}}};
}
function authMsg(e){const c=e&&e.code||'';
  if(/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c))return 'E-Mail oder Passwort stimmt nicht.';
  if(/too-many-requests/.test(c))return 'Zu viele Versuche. Bitte kurz warten.';
  if(/network/.test(c))return 'Keine Internetverbindung.';
  if(/api-key|app-not-authorized|configuration-not-found|operation-not-allowed/.test(c))return 'Die Firebase-Konfiguration passt nicht ('+c+'). Unten „Konfiguration ändern“ tippen.';
  return 'Anmeldung fehlgeschlagen ('+c+').'}
function doLogin(){const em=$('#lgMail').value.trim(),pw=$('#lgPw').value;if(!em||!pw){$('#lgErr').textContent='Bitte E-Mail und Passwort eingeben.';return}
  $('#lgErr').textContent='Melde an …';fbAuth.signInWithEmailAndPassword(em,pw).catch(e=>{$('#lgErr').textContent=authMsg(e);if(/api-key|app-not-authorized|configuration-not-found/.test(e&&e.code||'')){const b=$('#fbResetBtn');if(b)b.hidden=false}})}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='lgPw'||e.target.id==='lgMail'))doLogin()});
function fbScreen(){
  const lg='<span class="logo hero-logo"><svg viewBox="0 0 640 640" aria-hidden="true"><use href="#lg"/></svg></span>';
  if(fbState==='setup')return `<div class="card" style="max-width:640px;margin:0 auto;display:grid;gap:12px">${lg}<h2>Einrichtung</h2>
    <p class="muted" style="margin:0">Füge die Firebase-Konfiguration deiner Web-App ein (Firebase-Konsole → Projekteinstellungen → Deine Apps). Tipp: Trägst du sie in <b>config.js</b> ein, entfällt dieser Schritt auf allen Geräten.</p>
    <textarea class="inp" id="fbConf" style="height:180px" placeholder='apiKey: "…", authDomain: "…", projectId: "…", appId: "…"'></textarea>
    <div class="row"><span class="spacer"></span><button class="btn primary" data-act="fbsave">Speichern</button></div></div>`;
  if(fbState==='login')return `<div class="card" style="max-width:420px;margin:24px auto;display:grid;gap:12px">${lg}<h2 style="text-align:center">Anmelden</h2>
    <label class="fld">E-Mail<input class="inp" id="lgMail" type="email" autocomplete="username"></label>
    <label class="fld">Passwort<input class="inp" id="lgPw" type="password" autocomplete="current-password"></label>
    <div class="small" id="lgErr" role="status" style="min-height:20px;color:var(--bad)"></div>
    <button class="btn primary" data-act="login">Anmelden</button><div class="row" style="justify-content:center"><button class="btn small" data-act="pwreset" style="border:0;background:none">Passwort vergessen?</button><button class="btn small" data-act="fbreset" id="fbResetBtn" style="border:0;background:none" ${window.KK_FIREBASE?'hidden':''}>Konfiguration ändern</button></div></div>`;
  if(fbState==='error')return `<div class="card empty">${lg}<h2>Keine Verbindung</h2><p class="muted">${esc(loadErr)}</p></div>`;
  return `<div class="card empty">${lg}Wird geladen …</div>`;
}
async function initFirebase(){
  let conf=null;try{conf=JSON.parse(localStorage.getItem('kk-fb')||'null')}catch(e){}
  if(!conf)conf=window.KK_FIREBASE&&window.KK_FIREBASE.apiKey&&!/DEIN/i.test(window.KK_FIREBASE.apiKey)?window.KK_FIREBASE:null;
  if(!conf){fbState='setup';render();return}
  fbState='loading';render();
  try{for(const m of ['app','auth','firestore'])await loadScript(`https://www.gstatic.com/firebasejs/${FBV}/firebase-${m}-compat.js`)}
  catch(e){loadErr='Firebase konnte nicht geladen werden. Bitte Internetverbindung prüfen und neu laden.';fbState='error';render();return}
  firebase.initializeApp(conf);fbAuth=firebase.auth();const fs=firebase.firestore();
  try{fs.settings({ignoreUndefinedProperties:true})}catch(e){}
  try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
  db=fbAdapter(fs);let started=false;
  fbAuth.onAuthStateChanged(u=>{if(!u){fbState='login';render();setTimeout(()=>{const i=$('#lgMail');i&&i.focus()},50);return}
    fbState='ok';if(!started){started=true;subscribe()}render()});
}

/* ---------- Routing & Start ---------- */
const TABS=['eingabe','uebersicht','offen','kasse','beitraege','statistik','einstellungen'];
const TITLES={eingabe:'Eingabe',uebersicht:'Abend-Übersicht',offen:'Offene Beträge',kasse:'Kasse',beitraege:'Beiträge',statistik:'Statistik',einstellungen:'Einstellungen'};
function route(){let h=location.hash.slice(1);if(h==='abend')h='eingabe';ui.tab=TABS.includes(h)?h:'eingabe';closeDrawer();render()}
function openDrawer(){
  const ev=ui.eid?getEv(ui.eid):null;const d=$('#drawer');
  const L=(t,ico,label)=>`<a href="#${t}" ${ui.tab===t?'aria-current="page"':''}><span class="ico">${ico}</span>${label}</a>`;
  const B=(act,ico,label)=>`<button class="dl" data-act="${act}"><span class="ico">${ico}</span>${label}</button>`;
  d.innerHTML=`<div class="drawer-back" data-drawer-close></div><nav class="drawer" aria-label="Hauptmenü">
    <div class="dh"><span class="row" style="flex-wrap:nowrap"><span class="logo" style="width:60px;height:60px"><svg viewBox="0 0 640 640" aria-hidden="true"><use href="#lg"/></svg></span><strong class="brandname" style="display:block;font-size:19px;white-space:normal">${esc(cfg?.clubName||'Anrather Pegelkönige')}</strong></span><button class="hamb" data-drawer-close aria-label="Menü schließen">✕</button></div>
    <h4>Kegelabend</h4>${ev?`<div class="evinfo">${dlong(ev.date)} · ${ev.status==='open'?'läuft':ev.status==='cancelled'?'ausgefallen':'abgeschlossen'}</div>`:''}
    ${L('eingabe','✚','Strafen eingeben')}${L('uebersicht','≡','Abend-Übersicht')}
    ${ev?B('att','◉','Anwesenheit & Gäste')+B('editev','✎','Abend bearbeiten')+(ev.status==='open'?B('close','✓','Abend abschließen'):B('reopen','↺','Abend wieder öffnen')):''}
    ${B('newev','+','Neuer Abend')}
    ${FB&&fbAuth?.currentUser?`<h4>Konto</h4><div class="evinfo">${esc(fbAuth.currentUser.email||'')}</div>${B('logout','⎋','Abmelden')}`:''}<h4>Verein</h4>${L('offen','!','Offene Beträge')}${L('kasse','€','Kasse & Zahlungen')}${L('beitraege','▦','Beiträge')}${L('statistik','▲','Statistik')}${L('einstellungen','⚙','Einstellungen')}
  </nav>`;
  d.hidden=false;$('#menuBtn').setAttribute('aria-expanded','true');
  const first=d.querySelector('a,button.dl');first&&first.focus();
}
function closeDrawer(){const d=$('#drawer');if(!d||d.hidden)return;d.hidden=true;d.innerHTML='';$('#menuBtn').setAttribute('aria-expanded','false')}
document.addEventListener('click',e=>{
  if(e.target.closest('#menuBtn')){openDrawer();return}
  if(e.target.closest('[data-drawer-close]')){closeDrawer();return}
  if(e.target.closest('#drawer a')){closeDrawer()}
  if(e.target.closest('#drawer button.dl')){setTimeout(closeDrawer,0)}
},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
window.addEventListener('hashchange',route);
let themeTimer;new MutationObserver(()=>{clearTimeout(themeTimer);themeTimer=setTimeout(()=>{if(ui.tab==='statistik'||ui.tab==='kasse')render()},50)}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

let loadTimer;
function subscribe(){
  clearTimeout(loadTimer);loadTimer=setTimeout(()=>{if(!confirmed){loadErr='Die Daten sind gerade nicht erreichbar. Angezeigte Werte können veraltet sein.';scheduleRender(true)}},10000);
  const onErr=e=>{loadErr='Verbindung unterbrochen ('+(e&&e.code||'Fehler')+'). Bitte Seite neu öffnen.';clearTimeout(loadTimer);scheduleRender(true)};
  const ok=s=>{if(!s.metadata.fromCache&&!confirmed){confirmed=true;loadErr='';clearTimeout(loadTimer)}};
  db.doc('config/main').onSnapshot(s=>{cfg=s.exists?s.data():null;got.cfg=true;ok(s);scheduleRender()},onErr);
  db.collection('evenings').onSnapshot(s=>{const n={};s.docs.forEach(d=>n[d.id]=d.data());evs=n;got.ev=true;ok(s);scheduleRender()},onErr);
  db.collection('payments').onSnapshot(s=>{const n={};s.docs.forEach(d=>n[d.id]=d.data());pays=n;got.pay=true;scheduleRender()},onErr);
  db.collection('cashbook').onSnapshot(s=>{const n={};s.docs.forEach(d=>n[d.id]=d.data());cash=n;got.cash=true;scheduleRender()},onErr);
}
async function init(){
  route();
  if(FB)return initFirebase();
  for(let i=0;i<30&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,100));
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){noDb=true;render();return}
  subscribe();
}
init();
</script>
